<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMPACTBOX model viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d21; overflow: hidden; font: 13px system-ui, sans-serif; color: #ddd; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  #bar button { background: #0009; color: #ddd; border: 1px solid #fff3; border-radius: 4px; padding: 2px 7px; cursor: pointer; font: inherit; }
  #bar button.on { background: #c33; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "@dimforge/rapier3d-compat": "./vendor/rapier.es.js"
} }
</script>
<script type="module" src="viewer.js"></script>
</body>
</html>
